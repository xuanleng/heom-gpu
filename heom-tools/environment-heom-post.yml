# Conda environment for the heom-tools package (HDF5 and plotting).
#
# Create:   conda env create -f heom-tools/environment-heom-post.yml
# Activate: conda activate heom-post
# Install:  pip install -e "heom-tools[rqmc]"

name: heom-post
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy>=1.23
  - matplotlib>=3.5
  - h5py>=3.0
  - pyyaml>=6.0
  - pillow>=9.0          # twodes-plot --animate gif
  - pytest>=7.0
  - scipy>=1.13          # mc-disorder-gen --method rqmc + RQMC tests
