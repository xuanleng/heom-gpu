name: heom-tools tests

on:
  push:
    paths:
      - 'heom-tools/**'
      - '.github/workflows/heom-tools.yml'
  pull_request:
    paths:
      - 'heom-tools/**'
      - '.github/workflows/heom-tools.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install
        run: |
          pip install -e "heom-tools[rqmc]"
          pip install pytest
      - name: pytest
        working-directory: heom-tools
        env:
          MPLBACKEND: Agg
        run: python3 -m pytest
