# Benchmark: FMO-7 excited_only (7 sites, L=3, K=5)
# Deterministic output for regression testing

system:
  n_states: 7
  basis: "excited_only"
  temperature: 77.0
  hamiltonian:
    - [12400.0, -106.0,    8.0,   -5.0,    6.0,   -8.0,   -4.0]
    - [-106.0, 12540.0,   28.0,    6.0,    2.0,   13.0,    1.0]
    - [    8.0,   28.0, 12120.0,  -62.0,   -1.0,   -9.0,   17.0]
    - [   -5.0,    6.0,  -62.0, 12295.0,  -70.0,  -19.0,  -57.0]
    - [    6.0,    2.0,   -1.0,  -70.0, 12440.0,   40.0,   -2.0]
    - [   -8.0,   13.0,   -9.0,  -19.0,   40.0, 12480.0,   32.0]
    - [   -4.0,    1.0,   17.0,  -57.0,   -2.0,   32.0, 12380.0]
  w0: 12000.0

bath:
  spectral_density: "Drude-Lorentz"
  eta: 70.0
  gamma_inverse: 100.0
  expansion_method: matsubara
  n_extra_poles: 5
  L_cutoff: 3

filter:
  enabled: true
  tolerance: 1.0e-7

dynamics:
  integrator: rk4
  dt: 2.0
  n_steps: 500
  output_interval: 10
  print_interval: 100
  sink:
    enabled: false
    target_site: 3
    rate: 0.001
  initial_state:
    type: "site_excitation"
    excited_site: 1
  output:
    save_path: "tests/benchmark_data/"
    filename: "benchmark_fmo7"
    use_timestamp: false
